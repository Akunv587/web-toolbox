<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本分段工具 - 30行一段</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-dark: #5a4bd1;
            --primary-light: #a29bfe;
            --bg: #f0f2f8;
            --card-bg: #ffffff;
            --text: #2d3436;
            --text-secondary: #636e72;
            --border: #e0e3eb;
            --danger: #e17055;
            --danger-hover: #d35445;
            --success: #00b894;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.10);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #e8ecf3 0%, #f0f2f8 30%, #ede7f6 70%, #e8ecf3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px 60px;
            color: var(--text);
        }

        /* 背景装饰 */
        body::before {
            content: '';
            position: fixed;
            top: -180px;
            right: -120px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(108, 92, 231, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -140px;
            left: -100px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(162, 155, 254, 0.07) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 900px;
            position: relative;
            z-index: 1;
        }

        /* ====== Header ====== */
        .header {
            text-align: center;
            margin-bottom: 36px;
        }
        .header .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), #8b7cf0);
            color: #fff;
            font-size: 26px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.3);
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 6px;
        }

        /* ====== Input Card ====== */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 28px 30px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            border: 1px solid var(--border);
            transition: box-shadow var(--transition);
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--primary);
            display: inline-block;
        }

        .live-count {
            font-size: 13px;
            color: var(--text-secondary);
            background: #f8f9fb;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            transition: all var(--transition);
        }
        .live-count.highlight {
            color: var(--primary);
            border-color: var(--primary-light);
            background: #f5f3ff;
        }

        /* ====== Textarea ====== */
        .input-area {
            position: relative;
        }
        textarea {
            width: 100%;
            min-height: 240px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            font-size: 14px;
            font-family: "SF Mono", "Fira Code", "Cascadia Code", "Consolas", "Microsoft YaHei", monospace;
            line-height: 1.7;
            resize: vertical;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
            color: var(--text);
            background: #fafbfc;
        }
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.08);
            background: #fff;
        }
        textarea::placeholder {
            color: #b2bec3;
        }

        /* ====== 按钮组 ====== */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 22px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all var(--transition);
            white-space: nowrap;
            letter-spacing: 0.2px;
            position: relative;
            overflow: hidden;
        }
        .btn:active { transform: scale(0.96); }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #7c6ff0);
            color: #fff;
            box-shadow: 0 4px 14px rgba(108, 92, 231, 0.28);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.4);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: #fff;
            color: var(--primary);
            border: 2px solid var(--primary-light);
        }
        .btn-outline:hover {
            background: #f5f3ff;
            border-color: var(--primary);
        }

        .btn-danger {
            background: #fff;
            color: var(--danger);
            border: 2px solid #fab1a0;
        }
        .btn-danger:hover {
            background: #fff5f3;
            border-color: var(--danger);
        }

        .btn-sm {
            padding: 7px 16px;
            font-size: 13px;
            border-radius: 20px;
        }

        /* ====== 分段结果区域 ====== */
        .segments-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .segment-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: box-shadow var(--transition), transform var(--transition);
            animation: fadeSlideIn 0.4s ease forwards;
            opacity: 0;
        }
        .segment-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .segment-card:nth-child(1) { animation-delay: 0.05s; }
        .segment-card:nth-child(2) { animation-delay: 0.12s; }
        .segment-card:nth-child(3) { animation-delay: 0.19s; }
        .segment-card:nth-child(4) { animation-delay: 0.26s; }
        .segment-card:nth-child(5) { animation-delay: 0.33s; }

        .segment-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 22px;
            background: linear-gradient(135deg, #fafbff, #f5f3ff);
            border-bottom: 1px solid var(--border);
        }

        .segment-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 14px;
        }
        .segment-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), #7c6ff0);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
        }

        .segment-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .line-count-badge {
            font-size: 12px;
            color: var(--primary);
            background: #f0edff;
            padding: 4px 12px;
            border-radius: 14px;
            font-weight: 600;
        }

        .segment-content {
            padding: 16px 22px;
            font-family: "SF Mono", "Fira Code", "Cascadia Code", "Consolas", "Microsoft YaHei", monospace;
            font-size: 13.5px;
            line-height: 1.7;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 500px;
            overflow-y: auto;
            background: #fcfcfd;
        }

        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1.5px solid var(--border);
            background: #fff;
            color: var(--text-secondary);
            transition: all var(--transition);
        }
        .copy-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: #faf9ff;
        }
        .copy-btn.copied {
            border-color: var(--success);
            color: var(--success);
            background: #f0faf6;
        }
        .copy-btn svg {
            width: 14px;
            height: 14px;
        }

        /* ====== Toast ====== */
        .toast-container {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            animation: toastIn 0.35s ease, toastOut 0.35s ease 1.8s forwards;
            white-space: nowrap;
        }
        .toast.success { background: linear-gradient(135deg, #00b894, #00a381); }
        .toast.info    { background: linear-gradient(135deg, #6c5ce7, #5a4bd1); }
        .toast.warning { background: linear-gradient(135deg, #fdcb6e, #e0a800); color: #2d3436; }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0); }
            to   { opacity: 0; transform: translateY(-12px); }
        }

        /* ====== 空状态 ====== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #b2bec3;
        }
        .empty-state .empty-icon {
            font-size: 52px;
            margin-bottom: 16px;
            opacity: 0.6;
        }
        .empty-state p {
            font-size: 14px;
        }

        /* ====== 响应式 ====== */
        @media (max-width: 600px) {
            .container { padding: 0; }
            .card { padding: 20px 18px; border-radius: var(--radius-sm); }
            textarea { min-height: 180px; font-size: 13px; }
            .btn { padding: 8px 16px; font-size: 13px; }
            .segment-header { padding: 10px 14px; flex-wrap: wrap; gap: 8px; }
            .segment-content { padding: 12px 14px; font-size: 12px; }
            .header h1 { font-size: 22px; }
        }

        /* ====== 滚动条美化 ====== */
        textarea::-webkit-scrollbar,
        .segment-content::-webkit-scrollbar {
            width: 5px;
        }
        textarea::-webkit-scrollbar-track,
        .segment-content::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb,
        .segment-content::-webkit-scrollbar-thumb {
            background: #d0d5dd;
            border-radius: 10px;
        }
        textarea::-webkit-scrollbar-thumb:hover,
        .segment-content::-webkit-scrollbar-thumb:hover {
            background: #b0b8c4;
        }
    </style>
</head>
<body>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="icon">✂</div>
            <h1>文本分段工具</h1>
            <p>固定每段 30 行，最后一段不足 30 行也单独成段</p>
        </div>

        <!-- 输入区域 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">
                    <span class="dot"></span>粘贴/输入文本
                </span>
                <span class="live-count" id="liveCount">0 行</span>
            </div>
            <div class="input-area">
                <textarea
                    id="inputTextarea"
                    placeholder="在此粘贴或输入文本内容...&#10;支持从文件导入，也支持直接粘贴&#10;每 30 行自动分为一段"
                ></textarea>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="splitText()" title="按30行一段进行分段">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
                    立即分段
                </button>
                <button class="btn btn-outline" onclick="importFile()" title="从 .txt 文件导入文本">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    从文件导入
                </button>
                <button class="btn btn-danger" onclick="clearAll()" title="清空输入和所有分段结果">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    一键清空
                </button>
            </div>
        </div>

        <!-- 分段结果 -->
        <div id="segmentsContainer" class="segments-container">
            <div class="empty-state">
                <div class="empty-icon">📋</div>
                <p>粘贴文本后点击"立即分段"，结果会显示在这里</p>
            </div>
        </div>
    </div>

    <!-- 隐藏的文件选择器 -->
    <input type="file" id="fileInput" accept=".txt,.csv,.log,.md,.html,.json,.xml,.yaml,.yml,.py,.js,.ts,.java,.go,.rs,.c,.cpp,.h,.sql" style="display:none" onchange="handleFileImport(event)">

    <script>
        const ROWS_PER_SEGMENT = 30;

        // ====== DOM 引用 ======
        const inputTextarea = document.getElementById('inputTextarea');
        const liveCount = document.getElementById('liveCount');
        const segmentsContainer = document.getElementById('segmentsContainer');
        const fileInput = document.getElementById('fileInput');
        const toastContainer = document.getElementById('toastContainer');

        // ====== 实时行数统计 ======
        inputTextarea.addEventListener('input', () => {
            const lines = getNonEmptyLines(inputTextarea.value);
            const count = lines.length;
            liveCount.textContent = count + ' 行';
            liveCount.classList.toggle('highlight', count > 0);
        });

        function getNonEmptyLines(text) {
            // 按 \n 分割，保留空行（但去除末尾空行）
            const lines = text.split('\n');
            // 如果最后一行是空字符串且前面有内容，去掉末尾空行
            while (lines.length > 1 && lines[lines.length - 1] === '') {
                lines.pop();
            }
            return lines;
        }

        // ====== Toast 通知 ======
        function showToast(message, type) {
            type = type || 'info';
            var toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = message;
            toastContainer.appendChild(toast);

            setTimeout(function () {
                if (toast.parentNode) {
                    toast.parentNode.removeChild(toast);
                }
            }, 2200);
        }

        // ====== 立即分段 ======
        function splitText() {
            const text = inputTextarea.value;
            const lines = getNonEmptyLines(text);
            const totalLines = lines.length;

            if (totalLines === 0) {
                showToast('请先输入或粘贴文本内容', 'warning');
                return;
            }

            // 按 30 行一组分段
            const segments = [];
            for (let i = 0; i < totalLines; i += ROWS_PER_SEGMENT) {
                const chunk = lines.slice(i, i + ROWS_PER_SEGMENT);
                segments.push(chunk.join('\n'));
            }

            renderSegments(segments, totalLines);
            showToast('已分为 ' + segments.length + ' 段，共 ' + totalLines + ' 行', 'success');
        }

        // ====== 渲染分段结果 ======
        function renderSegments(segments, totalLines) {
            segmentsContainer.innerHTML = '';

            segments.forEach((content, index) => {
                const lines = content.split('\n');
                const lineCount = lines.length;

                const card = document.createElement('div');
                card.className = 'segment-card';

                const isLast = index === segments.length - 1;
                const labelText = isLast && lineCount < ROWS_PER_SEGMENT
                    ? '第 ' + (index + 1) + ' 段（末段）'
                    : '第 ' + (index + 1) + ' 段';

                card.innerHTML =
                    '<div class="segment-header">' +
                        '<div class="segment-label">' +
                            '<span class="segment-badge">' + (index + 1) + '</span>' +
                            labelText +
                        '</div>' +
                        '<div class="segment-meta">' +
                            '<span class="line-count-badge">' + lineCount + ' 行</span>' +
                            '<button class="copy-btn" data-index="' + index + '" title="复制本段内容">' +
                                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
                                    '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>' +
                                    '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>' +
                                '</svg>' +
                                '复制' +
                            '</button>' +
                        '</div>' +
                    '</div>' +
                    '<div class="segment-content">' + escapeHTML(content) + '</div>';

                segmentsContainer.appendChild(card);

                // 绑定复制事件
                setTimeout(function () {
                    var btn = card.querySelector('.copy-btn');
                    if (btn) {
                        btn.addEventListener('click', function () {
                            copySegment(content, btn);
                        });
                    }
                }, 0);
            });

            // 滚动到分段结果
            segmentsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ====== HTML 转义 ======
        function escapeHTML(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // ====== 复制单段内容 ======
        function copySegment(text, btnElement) {
            navigator.clipboard.writeText(text).then(function () {
                btnElement.classList.add('copied');
                btnElement.innerHTML =
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
                        '<polyline points="20 6 9 17 4 12"/>' +
                    '</svg>' +
                    '已复制';

                setTimeout(function () {
                    btnElement.classList.remove('copied');
                    btnElement.innerHTML =
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
                            '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>' +
                            '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>' +
                        '</svg>' +
                        '复制';
                }, 1800);
            }).catch(function () {
                showToast('复制失败，请检查浏览器权限', 'warning');
            });
        }

        // ====== 从文件导入 ======
        function importFile() {
            fileInput.click();
        }

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 检查文件大小（限定 10MB）
            if (file.size > 10 * 1024 * 1024) {
                showToast('文件过大，请选择小于 10MB 的文件', 'warning');
                fileInput.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                inputTextarea.value = e.target.result;
                // 触发 input 事件更新行数统计
                inputTextarea.dispatchEvent(new Event('input'));
                // 自动分段
                splitText();
                showToast('已导入文件: ' + file.name, 'success');
            };
            reader.onerror = function () {
                showToast('文件读取失败，请重试', 'warning');
            };
            reader.readAsText(file, 'UTF-8');

            // 重置以便重复选择同一文件
            fileInput.value = '';
        }

        // ====== 一键清空 ======
        function clearAll() {
            if (inputTextarea.value.trim() === '' && segmentsContainer.querySelector('.empty-state')) {
                showToast('当前没有内容需要清空', 'info');
                return;
            }

            inputTextarea.value = '';
            liveCount.textContent = '0 行';
            liveCount.classList.remove('highlight');
            segmentsContainer.innerHTML =
                '<div class="empty-state">' +
                    '<div class="empty-icon">📋</div>' +
                    '<p>粘贴文本后点击"立即分段"，结果会显示在这里</p>' +
                '</div>';
            showToast('已清空全部内容', 'info');
        }

        // ====== 快捷键 ======
        document.addEventListener('keydown', function (e) {
            // Ctrl/Cmd + Enter → 立即分段
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                splitText();
            }
            // Ctrl/Cmd + Shift + X → 一键清空
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'X') {
                e.preventDefault();
                clearAll();
            }
        });

        // ====== 拖拽导入支持 ======
        document.addEventListener('dragover', function (e) {
            e.preventDefault();
            e.stopPropagation();
        });
        document.addEventListener('drop', function (e) {
            e.preventDefault();
            e.stopPropagation();
            var file = e.dataTransfer.files[0];
            if (!file) return;
            // 模拟触发文件导入
            var dt = new DataTransfer();
            dt.items.add(file);
            fileInput.files = dt.files;
            handleFileImport({ target: { files: dt.files } });
        });

        console.log('✨ 文本分段工具已就绪');
        console.log('   快捷键: Ctrl+Enter → 立即分段 | Ctrl+Shift+X → 一键清空');
        console.log('   也支持拖拽 .txt 文件到页面导入');
    </script>
</body>
</html>
